<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Threads OAuth callback</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; }
  code { display: block; background: #f2f2f2; padding: 16px; border-radius: 8px; font-size: 18px; word-break: break-all; margin: 16px 0; }
  button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
  .err { color: #b00020; }
</style>
</head>
<body>
  <h2>Код авторизации Threads</h2>
  <div id="out">Читаю адресную строку...</div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const err = params.get("error_description") || params.get("error");
    const out = document.getElementById("out");
    if (code) {
      out.innerHTML = "Скопируйте этот код и отправьте его в чат с Клодом:<code id='code'>" + code + "</code>";
      const btn = document.createElement("button");
      btn.textContent = "Скопировать";
      btn.onclick = () => navigator.clipboard.writeText(code).then(() => btn.textContent = "Скопировано!");
      out.appendChild(btn);
    } else if (err) {
      out.innerHTML = "<p class='err'>Meta вернула ошибку: " + err + "</p>";
    } else {
      out.innerHTML = "<p class='err'>Код не найден в адресной строке.</p>";
    }
  </script>
</body>
</html>
